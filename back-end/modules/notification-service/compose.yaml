name: hrm-notification

services:
  notification:
    image: ${IMAGE_REPOSITORY:-company-hrm/notification}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env.docker
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8086"
      JWT_ACCESS_PUBLIC_KEY: file:/run/secrets/access-public.pem
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8086}:8086"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - source: access-public
        target: access-public.pem
    networks:
      services:
        aliases: [notification]

networks:
  services:
    name: ${HRM_DOCKER_NETWORK:-hrm-services}
    external: true

secrets:
  access-public:
    file: ${JWT_ACCESS_PUBLIC_KEY_FILE:-./keys/access-public.pem}
