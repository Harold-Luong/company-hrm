spring.application.name=notification-service
server.port=${NOTIFICATION_PORT:8086}
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_db}
spring.datasource.username=${NOTIFICATION_DB_USER:notification_user}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:notification_password}
spring.sql.init.mode=never
jwt.access-public-key=${JWT_ACCESS_PUBLIC_KEY:file:../auth-service-main/keys/access-public.pem}
jwt.access-issuer=${JWT_ACCESS_ISSUER:auth-service}
jwt.access-audience=${JWT_ACCESS_AUDIENCE:hrm-api-access}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=hrm-notifications-v1
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.listener.ack-mode=record
hrm.notifications.enabled=${HRM_NOTIFICATIONS_ENABLED:false}
