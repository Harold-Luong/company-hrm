spring:
  datasource:
    url: jdbc:h2:mem:attendance-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: always
      schema-locations: file:docs/sql/001_attendance_schema.sql

attendance:
  allowed-networks: 127.0.0.1/32
  trusted-proxies: []
