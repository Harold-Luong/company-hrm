spring.application.name=calendar-service
server.port=${CALENDAR_PORT:8083}
spring.datasource.url=${CALENDAR_DB_URL:jdbc:postgresql://localhost:5432/calendar_db}
spring.datasource.username=${CALENDAR_DB_USER:calendar_user}
spring.datasource.password=${CALENDAR_DB_PASSWORD:calendar_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Swagger UI reads the maintained OpenAPI file, as in Employee Service.
springdoc.enable-default-api-docs=false
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi/calendar-api.yml
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operations-sorter=method

# Verify Auth access tokens locally; never use a private key or refresh-token key.
jwt.access-public-key=${JWT_ACCESS_PUBLIC_KEY:file:../auth-service-main/keys/access-public.pem}
jwt.access-issuer=${JWT_ACCESS_ISSUER:auth-service}
jwt.access-audience=${JWT_ACCESS_AUDIENCE:hrm-api-access}
