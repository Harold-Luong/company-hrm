spring.application.name=leave-service
hrm.notifications.enabled=${HRM_NOTIFICATIONS_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
server.port=${LEAVE_PORT:8084}
spring.datasource.url=${LEAVE_DB_URL:jdbc:postgresql://localhost:5432/leave_db}
spring.datasource.username=${LEAVE_DB_USER:leave_user}
spring.datasource.password=${LEAVE_DB_PASSWORD:leave_password}
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.mvc.problemdetails.enabled=true
jwt.access-public-key=${JWT_ACCESS_PUBLIC_KEY:file:../auth-service-main/keys/access-public.pem}
jwt.access-issuer=${JWT_ACCESS_ISSUER:auth-service}
jwt.access-audience=${JWT_ACCESS_AUDIENCE:hrm-api-access}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
