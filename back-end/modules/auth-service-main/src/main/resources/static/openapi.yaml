openapi: 3.0.3
info:
    title: Auth Service API
    version: 1.0.0
    description: |
        API tạo tài khoản nội bộ, đăng nhập và quản lý phiên xác thực.
        /register chỉ dành cho ADMIN; không hỗ trợ đăng ký công khai.
        ADMIN có cùng quyền nghiệp vụ với HR, thêm quyền tạo tài khoản và yêu cầu cấp tài khoản cho nhân viên.
        MANAGER giữ lại để thiết kế sau, chưa có quyền quản lý nhóm hoặc xét duyệt riêng.

        Đăng nhập để lấy access token và refresh token. Với API có biểu tượng khóa,
        chọn Authorize và nhập access token (không thêm tiền tố Bearer).
        Refresh token chỉ nằm trong cookie HttpOnly; không trả trong JSON và không nhận từ body.
        Gọi GET /api/v1/auth/csrf, giữ cookie và gửi token trả về trong header X-XSRF-TOKEN cho login/refresh/logout/logout-all.

        Dữ liệu mẫu local từ docs/sql/002_auth_seed.sql có admin@company.com
        (EMPLOYEE, ADMIN) và hr@company.com (EMPLOYEE, HR), mật khẩu Admin@123456.
        Chạy docs/sql/001_auth_schema.sql trước, rồi chạy seed để thử đăng nhập.
        Mật khẩu mẫu chỉ áp dụng cho tài khoản mới do seed tạo; chạy lại seed
        không đổi mật khẩu hoặc roles của tài khoản đã tồn tại.

        Access/refresh JWT chứa sid; login mới đổi sid, refresh giữ sid. Token trước bản nâng cấp thiếu sid cần đăng nhập lại.
        /refresh cấp cặp token mới và thu hồi refresh token cũ sau khi sử dụng thành công.
        Mỗi tài khoản có một phiên hiện hành: login mới thay phiên cũ; logout thu hồi cả access và refresh token.
        Mỗi request dùng access token kiểm tra trạng thái và tập roles hiện tại trong database.
servers:
    - url: /
      description: Server đang phục vụ Swagger UI
tags:
    - name: Account administration
      description: Quản trị tài khoản và thu hồi quyền, chỉ ADMIN
    - name: Authentication
      description: Đăng ký, đăng nhập, refresh và đăng xuất
    - name: User
      description: Thông tin người dùng đang đăng nhập
security: []

paths:
    /api/v1/auth/accounts:
      get:
        tags:
        - Account administration
        operationId: listAccounts
        summary: Danh sách tài khoản dành cho ADMIN
        security: &id001
        - bearerAuth: []
        parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 255
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ManagedAccountStatus'
        - name: role
          in: query
          schema:
            type: string
            enum:
            - EMPLOYEE
            - MANAGER
            - HR
            - ADMIN
        - &id007
          name: page
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
        - &id008
          name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        responses:
          '200':
            description: Thành công
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ManagedAccountPage'
          '400': &id002
            description: Tham số hoặc body không hợp lệ
          '401': &id003
            description: Thiếu phiên hoặc phiên đã bị thu hồi
          '403': &id004
            description: Chỉ ADMIN
          '404': &id005
            description: Không tìm thấy tài khoản
    /api/v1/auth/accounts/{id}:
      get:
        tags:
        - Account administration
        operationId: getManagedAccount
        security: *id001
        parameters:
        - &id006
          name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        responses:
          '200':
            description: Thành công
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ManagedAccount'
          '400': *id002
          '401': *id003
          '403': *id004
          '404': *id005
    /api/v1/auth/accounts/{id}/audit:
      get:
        tags:
        - Account administration
        operationId: getAccountAudit
        security: *id001
        parameters:
        - *id006
        - *id007
        - *id008
        responses:
          '200':
            description: Thành công
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AccountAuditPage'
          '400': *id002
          '401': *id003
          '403': *id004
          '404': *id005
    /api/v1/auth/accounts/{id}/actions:
      post:
        tags:
        - Account administration
        operationId: administerAccount
        summary: Khóa/mở, thay vai trò hoặc buộc đăng xuất
        description: Không cho tự sửa chính mình. Kiểm tra version và quyền actor trong transaction; thu hồi toàn bộ
          refresh session/sid, ghi audit. Mở khóa không kích hoạt tài khoản pending. Quyền cũ bị từ chối ở request xác
          thực tiếp theo; request đang xử lý có thể hoàn tất. Chỉ xác thực Bearer, cookie không cấp quyền.
        security: *id001
        parameters:
        - *id006
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCommand'
        responses:
          '200':
            description: Thành công
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ManagedAccount'
          '400': *id002
          '401': *id003
          '403': *id004
          '404': *id005
          '409':
            description: Tự sửa tài khoản hoặc trạng thái không cho phép thao tác
          '412':
            description: 'ACCOUNT_VERSION_CONFLICT: tải lại trước khi thực hiện tiếp'
    /api/v1/auth/csrf:
        get:
            tags: [Authentication]
            operationId: csrf
            summary: Lấy CSRF token cho browser
            description: Trả masked token, đặt cookie CSRF HttpOnly nếu cần; không tạo HTTP session. Không cache response.
            responses:
                "200":
                    description: Token dùng cho X-XSRF-TOKEN; sessionPresent chỉ báo có cookie, chưa xác thực phiên.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [token, headerName, sessionPresent]
                                properties:
                                    token:
                                        type: string
                                    headerName:
                                        type: string
                                        enum: [X-XSRF-TOKEN]
                                    sessionPresent:
                                        type: boolean
    /api/v1/auth/activate:
        post:
            tags: [Authentication]
            operationId: activateAccount
            summary: Đặt mật khẩu và kích hoạt bằng token từ email
            description: Token một lần, có hạn dùng. Mật khẩu ít nhất 12 ký tự và tối đa 72 byte UTF-8. Không trả JWT.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [token, password]
                            properties:
                                token:
                                    type: string
                                    pattern: '^[A-Za-z0-9_-]{43}$'
                                    writeOnly: true
                                password:
                                    type: string
                                    format: password
                                    minLength: 12
                                    maxLength: 72
                                    writeOnly: true
            responses:
                "200":
                    description: Đã kích hoạt; có thể đăng nhập bằng mật khẩu vừa đặt
                "400":
                    description: Token sai/hết hạn/đã dùng/thu hồi hoặc mật khẩu không hợp lệ
                "503":
                    description: Tính năng chưa bật
    /api/v1/auth/activation-invitations/{employeeId}:
        parameters:
            - in: path
              name: employeeId
              required: true
              schema:
                  type: string
                  format: uuid
        post:
            tags: [Authentication]
            operationId: resendActivationInvitation
            summary: HR/Admin gửi lại email kích hoạt
            description: Gửi tới email Account trong Auth; thu hồi token cũ. Cooldown 60 giây/account. 202 chỉ xác nhận đã xếp hàng gửi mail.
            security:
                - bearerAuth: []
            responses:
                "202":
                    description: Đã xếp hàng lời mời mới
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    invitationId: { type: string, format: uuid }
                                    deliveryStatus: { type: string, enum: [PENDING] }
                                    expiresAt: { type: string, format: date-time }
                "401": { description: Chưa đăng nhập }
                "403": { description: Cần HR hoặc ADMIN }
                "404": { description: Account không tồn tại }
                "409": { description: Account không chờ kích hoạt }
                "429":
                    description: Chưa hết cooldown
                    headers:
                        Retry-After:
                            schema: { type: integer }
                            description: Số giây cần chờ
                "503": { description: Tính năng chưa bật }
        get:
            tags: [Authentication]
            operationId: latestActivationInvitation
            summary: HR/Admin kiểm tra email kích hoạt gần nhất
            description: SENT nghĩa là Resend đã chấp nhận email, không phải xác nhận inbox đã nhận hoặc account đã kích hoạt.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Trạng thái gửi email, không chứa token
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    invitationId: { type: string, format: uuid }
                                    deliveryStatus: { type: string, enum: [PENDING, SENT, FAILED, CANCELLED] }
                                    expiresAt: { type: string, format: date-time }
                                    sentAt: { type: string, format: date-time, nullable: true }
                                    attempts: { type: integer }
                                    errorCode: { type: string, nullable: true }
                "401": { description: Chưa đăng nhập }
                "403": { description: Cần HR hoặc ADMIN }
                "404": { description: Chưa có lời mời }
                "503": { description: Tính năng chưa bật }
    /api/v1/auth/health-check:
        get:
            tags: [Authentication]
            operationId: healthCheck
            summary: Kiểm tra ứng dụng và kết nối database
            description: Không cần token hoặc query parameter. Kiểm tra kết nối, không kiểm tra schema database.
            security: []
            responses:
                "200":
                    description: Kết nối database hoạt động
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/HealthCheckResponse"
                            example:
                                status: UP
                                database: UP
                "503":
                    description: Không thể kết nối hoặc kết nối database không hợp lệ
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/HealthCheckResponse"
                            example:
                                status: DOWN
                                database: DOWN
                "401":
                    $ref: "#/components/responses/InvalidAccessToken"
                "403":
                    $ref: "#/components/responses/InactiveUser"

    /api/v1/auth/register:
        post:
            tags: [Authentication]
            operationId: register
            summary: Admin tạo tài khoản
            description: |
                API cũ chỉ tạo tài khoản khi HRM_EVENTS_ENABLED=false (mặc định).
                Khi bật luồng Kafka, API trả 409; gửi yêu cầu cấp tài khoản qua Employee.
                Email được loại bỏ khoảng trắng ở hai đầu và chuyển thành chữ thường.
                Yêu cầu role ADMIN. Tài khoản mới có roles mặc định [EMPLOYEE] và active = true.
                Role hợp lệ: EMPLOYEE, MANAGER, HR hoặc ADMIN.
                employeeId bắt buộc là UUID và chưa được liên kết với tài khoản khác; đường API cũ chưa xác minh ID tại Employee.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RegisterRequest"
            responses:
                "200":
                    description: Đăng ký thành công
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MessageResponse"
                            example:
                                message: User registered successfully!
                "400":
                    description: Dữ liệu không hợp lệ, JSON lỗi, email đã tồn tại hoặc nhân viên đã có tài khoản
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            examples:
                                invalidEmail:
                                    value:
                                        code: "400"
                                        message: "email: Email must be valid"
                                duplicateEmail:
                                    value:
                                        code: "400"
                                        message: Email already exists
                "409":
                    description: Luồng cấp tài khoản qua Employee đã bật; không dùng register trực tiếp
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    description: Tài khoản không hoạt động hoặc không có role ADMIN
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "500":
                    $ref: "#/components/responses/ServerError"

    /api/v1/auth/login:
        post:
            tags: [Authentication]
            operationId: login
            summary: Đăng nhập
            description: |
                Xác thực email và mật khẩu, trả access token và đặt refresh cookie HttpOnly qua Set-Cookie.
                Đăng nhập thành công thay thế phiên cũ, vô hiệu hóa cả access token và refresh token của phiên cũ.
                Với dữ liệu seed local, chọn ví dụ Admin hoặc HR bên dưới:
                admin@company.com hoặc hr@company.com, cùng mật khẩu Admin@123456.
                Nếu tài khoản đã đổi mật khẩu, dùng mật khẩu hiện tại; chạy lại seed không reset mật khẩu.
                Account chưa kích hoạt hoặc đã vô hiệu hóa bị từ chối với 403.
                Mặc định giới hạn 10 lượt/tài khoản và 50 lượt/IP trong cửa sổ 15 phút,
                tính cả lượt thành công. Các giới hạn có thể thay đổi qua cấu hình.
                Vượt giới hạn trả 429 kèm header Retry-After (số giây cần chờ).
                Bộ đếm hiện áp dụng riêng cho từng instance.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LoginRequest"
                        examples:
                            admin:
                                summary: Admin từ seed local (EMPLOYEE, ADMIN)
                                value:
                                    email: admin@company.com
                                    password: Admin@123456
                            hr:
                                summary: HR từ seed local (EMPLOYEE, HR)
                                value:
                                    email: hr@company.com
                                    password: Admin@123456
            security:
                - csrfHeader: []
            responses:
                "200":
                    description: Đăng nhập thành công
                    headers:
                        Set-Cookie:
                            description: Cookie refresh HttpOnly, Secure, SameSite=Strict; logout xóa bằng Max-Age=0.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/LoginResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    description: Email/mật khẩu sai, hoặc Bearer token gửi kèm không hợp lệ
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            examples:
                                credentials:
                                    value:
                                        code: "401"
                                        message: Invalid email or password
                                accessToken:
                                    value:
                                        message: Invalid or expired access token
                "403":
                    description: CSRF token thiếu/không hợp lệ hoặc tài khoản đã vô hiệu hóa.
                "429":
                    description: Vượt giới hạn tài khoản/IP hoặc bộ đếm đã đạt giới hạn dung lượng
                    headers:
                        Retry-After:
                            description: Số giây cần chờ trước khi thử lại
                            schema:
                                type: integer
                                format: int64
                                minimum: 1
                                example: 900
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            example:
                                code: "429"
                                message: Too many login attempts. Please try again later.
                "500":
                    $ref: "#/components/responses/ServerError"

    /api/v1/auth/refresh:
        post:
            tags: [Authentication]
            operationId: refresh
            summary: Cấp cặp token mới và thu hồi refresh token cũ
            description: |
                Xác minh refresh token, hash và phiên trong database trước khi cấp access token.
                Không cần Authorization header. Endpoint này bỏ qua kiểm tra access token,
                kể cả khi client gửi kèm access token đã hết hạn.
                Mỗi refresh token chỉ được sử dụng thành công một lần, kể cả với request đồng thời.
                Browser tự nhận refresh cookie mới từ Set-Cookie; JavaScript không được đọc refresh token.
                Refresh token mới có thời hạn tính từ lúc cấp theo cấu hình refresh-token-expiration.
            security:
                - csrfHeader: []
                  refreshCookie: []
            responses:
                "200":
                    description: Access token và refresh token mới; refresh token cũ đã bị thu hồi
                    headers:
                        Set-Cookie:
                            description: Cookie refresh HttpOnly, Secure, SameSite=Strict; logout xóa bằng Max-Age=0.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AccessTokenResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/InvalidRefreshToken"
                "403":
                    description: CSRF token thiếu/không hợp lệ hoặc tài khoản đã vô hiệu hóa.
                "500":
                    $ref: "#/components/responses/ServerError"

    /api/v1/auth/logout:
        post:
            tags: [Authentication]
            operationId: logout
            summary: Đăng xuất một phiên
            description: |
                Gửi refresh cookie và CSRF header để thu hồi phiên tương ứng. Cookie được xóa qua Set-Cookie Max-Age=0.
                Không có cookie thì logout thành công mà không đổi phiên nào; cookie sai/hết hạn vẫn được xóa.
                Không cần gửi Authorization header. Nếu vẫn gửi Bearer token không hợp lệ
                hoặc đã hết hạn, JWT filter hiện tại sẽ từ chối request với 401.
                Gọi lại bằng refresh token đã thu hồi cũng trả 401.
                Access token của phiên đã đăng xuất bị từ chối ở request tiếp theo.
            security:
                - csrfHeader: []
            responses:
                "200":
                    description: Đã thu hồi phiên
                    headers:
                        Set-Cookie:
                            description: Cookie refresh HttpOnly, Secure, SameSite=Strict; logout xóa bằng Max-Age=0.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MessageResponse"
                            example:
                                message: Logged out successfully
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    description: Refresh token không hợp lệ/đã thu hồi, hoặc Bearer token gửi kèm không hợp lệ
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            examples:
                                refreshToken:
                                    value:
                                        code: "401"
                                        message: Invalid refresh token
                                accessToken:
                                    value:
                                        message: Invalid or expired access token
                "403":
                    description: CSRF token thiếu/không hợp lệ hoặc tài khoản đã vô hiệu hóa.
                "500":
                    $ref: "#/components/responses/ServerError"

    /api/v1/auth/logout-all:
        post:
            tags: [Authentication]
            operationId: logoutAll
            summary: Đăng xuất tất cả phiên
            description: |
                Yêu cầu access token còn hạn trong Authorization header, không cần body.
                Thu hồi toàn bộ refresh session của user được xác định từ access token.
                Vô hiệu hóa cả access token và refresh token của phiên hiện tại.
                Gọi lại bằng access token vừa bị thu hồi trả 401.
            security:
                - csrfHeader: []
                  bearerAuth: []
            responses:
                "200":
                    description: Đã thu hồi các phiên của user
                    headers:
                        Set-Cookie:
                            description: Cookie refresh HttpOnly, Secure, SameSite=Strict; logout xóa bằng Max-Age=0.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MessageResponse"
                            example:
                                message: All sessions logged out successfully
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    description: CSRF token thiếu/không hợp lệ hoặc tài khoản đã vô hiệu hóa.
                "500":
                    $ref: "#/components/responses/ServerError"

    /api/v1/auth/session:
        get:
            tags: [Authentication]
            operationId: verifyCurrentSession
            summary: Kiểm tra phiên đăng nhập hiện hành
            description: Xác minh JWT và sid với account trong DB. Dùng trực tiếp bởi Gateway và resource service; không cache kết quả chấp nhận.
            security:
                - bearerAuth: []
            responses:
                "204":
                    description: Phiên hợp lệ
                    headers:
                        Cache-Control:
                            schema: {type: string, example: no-store}
                "401":
                    description: Token sai, hết hạn, thiếu sid hoặc phiên đã bị thay thế/đăng xuất
                "403":
                    $ref: "#/components/responses/InactiveUser"
                "500":
                    $ref: "#/components/responses/ServerError"

    /api/v1/auth/me:
        get:
            tags: [User]
            operationId: me
            summary: Thông tin user hiện tại
            description: Lấy thông tin user dựa trên access token trong Authorization header.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Thông tin user
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/InactiveUser"
                "500":
                    $ref: "#/components/responses/ServerError"

components:
    securitySchemes:
        refreshCookie:
            type: apiKey
            in: cookie
            name: __Host-hrm-refresh
            description: Cookie HttpOnly do login/refresh đặt. Local HTTP dùng hrm-refresh-dev khi AUTH_COOKIES_SECURE=false.
        csrfHeader:
            type: apiKey
            in: header
            name: X-XSRF-TOKEN
            description: Token từ GET /api/v1/auth/csrf, gửi kèm cookie CSRF do cùng endpoint đặt.
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: Nhập access token nhận từ /login hoặc /refresh, không thêm tiền tố Bearer.

    schemas:
        ManagedAccountStatus:
          type: string
          enum:
          - ACTIVE
          - DISABLED
          - PENDING_ACTIVATION
        AccountAction:
          type: string
          enum:
          - DISABLE
          - ENABLE
          - CHANGE_ROLES
          - REVOKE_SESSIONS
        AccountCommand:
          type: object
          required:
          - version
          - action
          - reason
          properties:
            version:
              type: integer
              format: int64
              minimum: 0
            action:
              $ref: '#/components/schemas/AccountAction'
            roles:
              type: array
              minItems: 1
              uniqueItems: true
              items: &schema_id001
                type: string
                enum:
                - EMPLOYEE
                - MANAGER
                - HR
                - ADMIN
              description: Chỉ có với CHANGE_ROLES; bắt buộc cho action này.
            reason:
              type: string
              minLength: 1
              maxLength: 500
        ManagedAccount:
          type: object
          required:
          - id
          - employeeId
          - email
          - status
          - activationPending
          - roles
          - version
          properties:
            id:
              type: integer
              format: int64
            employeeId:
              type: string
              format: uuid
            email:
              type: string
            status:
              $ref: '#/components/schemas/ManagedAccountStatus'
            activationPending:
              type: boolean
            roles:
              type: array
              minItems: 1
              uniqueItems: true
              items: *schema_id001
            version:
              type: integer
              format: int64
            lastLoginAt:
              type:
              - string
              - 'null'
              format: date-time
            createdAt:
              type: string
              format: date-time
        AccountAuditEntry:
          type: object
          properties:
            id:
              type: integer
              format: int64
            actorId:
              type: integer
              format: int64
            accountId:
              type: integer
              format: int64
            version:
              type: integer
              format: int64
            actorEmail:
              type: string
            accountEmail:
              type: string
            reason:
              type: string
            beforeRoles:
              type: string
            afterRoles:
              type: string
            action:
              $ref: '#/components/schemas/AccountAction'
            beforeStatus:
              $ref: '#/components/schemas/ManagedAccountStatus'
            afterStatus:
              $ref: '#/components/schemas/ManagedAccountStatus'
            createdAt:
              type: string
              format: date-time
        ManagedAccountPage:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ManagedAccount'
            page:
              type: integer
            totalPages:
              type: integer
            totalElements:
              type: integer
              format: int64
        AccountAuditPage:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/AccountAuditEntry'
            page:
              type: integer
            totalPages:
              type: integer
            totalElements:
              type: integer
              format: int64
        HealthCheckResponse:
            type: object
            required: [status, database]
            properties:
                status:
                    type: string
                    enum: [UP, DOWN]
                database:
                    type: string
                    enum: [UP, DOWN]

        LoginRequest:
            type: object
            required: [email, password]
            properties:
                email:
                    type: string
                    format: email
                    minLength: 1
                    maxLength: 255
                    description: Email bắt buộc; khoảng trắng ở hai đầu được loại bỏ trước validation.
                    example: admin@company.com
                password:
                    type: string
                    format: password
                    writeOnly: true
                    minLength: 1
                    pattern: '\S'
                    description: Không được rỗng hoặc chỉ gồm khoảng trắng. Password không được trim.
                    example: Admin@123456
        RegisterRequest:
            allOf:
                - $ref: "#/components/schemas/LoginRequest"
                - type: object
                  required: [employeeId]
                  properties:
                      employeeId:
                          type: string
                          format: uuid
                          description: ID nhân viên bắt buộc cho mọi tài khoản, kể cả HR/ADMIN; mỗi nhân viên chỉ liên kết một tài khoản.
                          example: "550e8400-e29b-41d4-a716-000000001001"
                      roles:
                          type: array
                          nullable: true
                          minItems: 1
                          uniqueItems: true
                          items:
                              type: string
                              enum: [EMPLOYEE, MANAGER, HR, ADMIN]
                          default: [EMPLOYEE]
                          example: [EMPLOYEE, HR]
                          description: Tập role được cấp; bỏ qua hoặc null sẽ dùng [EMPLOYEE]. Mảng rỗng hoặc phần tử null/không hợp lệ trả 400. Role trùng được gộp; thứ tự không có ý nghĩa.
        LoginResponse:
            type: object
            required: [message, data]
            properties:
                message:
                    type: string
                    example: Login successful
                data:
                    $ref: "#/components/schemas/LoginData"
        LoginData:
            type: object
            required: [tokenType, accessToken, accessTokenExpiresIn]
            properties:
                tokenType:
                    type: string
                    example: Bearer
                accessToken:
                    type: string
                    description: JWT cho Authorization header, chỉ giữ trong bộ nhớ frontend.
                accessTokenExpiresIn:
                    type: integer
                    format: int64
        AccessTokenResponse:
            type: object
            required: [accessToken]
            properties:
                accessToken:
                    type: string
                    description: Access JWT mới; refresh token chỉ được đặt bằng Set-Cookie.
        UserResponse:
            type: object
            required:
                [id, employeeId, email, active, roles, lastLoginAt, createdAt, updatedAt]
            properties:
                id:
                    type: integer
                    format: int64
                    example: 1
                employeeId:
                    type: string
                    format: uuid
                    description: ID nhân viên đang liên kết với tài khoản.
                    example: "10000000-0000-0000-0000-000000000001"
                email:
                    type: string
                    format: email
                    example: hr@company.com
                active:
                    type: boolean
                    example: true
                roles:
                    type: array
                    uniqueItems: true
                    items:
                        type: string
                        enum: [EMPLOYEE, MANAGER, HR, ADMIN]
                    description: Tập role hiện tại của account; thứ tự không có ý nghĩa.
                    example: [EMPLOYEE, HR]
                lastLoginAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Lần đăng nhập thành công gần nhất; null nếu chưa đăng nhập. Refresh không cập nhật trường này.
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        MessageResponse:
            type: object
            required: [message]
            properties:
                message:
                    type: string
        ErrorResponse:
            type: object
            required: [message]
            description: |
                Lỗi từ service, validation và authentication entry point có code và message.
                Lỗi access token từ JWT filter hiện chỉ có message, nên code không bắt buộc.
            properties:
                code:
                    type: string
                    description: HTTP status được biểu diễn bằng chuỗi, nếu có.
                    example: "400"
                message:
                    type: string
                    example: "email: Email is required"

    responses:
        BadRequest:
            description: Thiếu trường bắt buộc, dữ liệu không hợp lệ, thiếu body hoặc JSON lỗi
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
                    examples:
                        unreadableBody:
                            value:
                                code: "400"
                                message: Request body is missing or contains invalid JSON
        Unauthorized:
            description: Thiếu access token cho API được bảo vệ hoặc Bearer token không hợp lệ
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
                    examples:
                        authenticationRequired:
                            value:
                                code: "401"
                                message: Authentication is required
                        invalidAccessToken:
                            value:
                                message: Invalid or expired access token
        InvalidAccessToken:
            description: Bearer token gửi kèm không hợp lệ hoặc hết hạn; API này không yêu cầu Authorization header.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
                    example:
                        message: Invalid or expired access token
        InvalidRefreshToken:
            description: Refresh token sai chữ ký, hết hạn, sai hash/user hoặc phiên đã bị thu hồi
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
                    example:
                        code: "401"
                        message: Invalid refresh token
        InactiveUser:
            description: Tài khoản không hoạt động
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
                    example:
                        code: "403"
                        message: User is inactive
        SessionNotFound:
            description: Không tìm thấy refresh session trong database
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
                    example:
                        code: "404"
                        message: Session not found
        ServerError:
            description: Lỗi nội bộ hoặc lỗi truy cập database; định dạng body phụ thuộc nguồn lỗi.
